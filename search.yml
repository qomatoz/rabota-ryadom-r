name: Search vacancies
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "fetch_vacancies.py"
      - ".github/workflows/search.yml"
jobs:
  search:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch vacancies
        run: python fetch_vacancies.py
      - name: Save updated data
        run: |
          git config user.name "vacancy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/vacancies.json
          git diff --cached --quiet || git commit -m "Update vacancy feed"
          git push
